name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # worker/test/*.test.mjs needs no real secrets or a live database: every network call
  # (fetch, pg) goes through a fake (see worker/test/fakes.mjs), so this job never reads
  # SUPABASE_*/WATCH_*/DATABASE_URL/TELEGRAM_* and has none configured as secrets.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  web-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
